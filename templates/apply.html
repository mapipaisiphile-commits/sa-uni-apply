<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply - SA Uni Apply 2026</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
.form{background:white;color:black;padding:20px;border-radius:12px;max-width:500px;margin:auto}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
label{font-weight:bold;font-size:14px;margin-top:10px;display:block}
button{background:#16a34a;color:white;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;margin-top:15px}
small{color:gray}
</style>
</head>
<body>
<div class="form">
<h2>Apply to SA Universities 2026</h2>
<p>Select university and upload ALL documents</p>

<form action="/submit" method="POST" enctype="multipart/form-data">

<label>Full Name & Surname</label>
<input type="text" name="fullname" required placeholder="Isiphile Mapipa">

<label>ID Number</label>
<input type="text" name="idnumber" required placeholder="0000000000000">

<label>Phone / WhatsApp</label>
<input type="text" name="phone" required placeholder="07...">

<label>Select University</label>
<select name="university" required>
<option value="">-- Choose --</option>
<option>University of Johannesburg (UJ)</option>
<option>University of Pretoria (UP)</option>
<option>WITS</option>
<option>UNISA</option>
<option>TUT</option>
<option>University of Limpopo</option>
<option>UJ + UP + WITS (3 Choices)</option>
</select>

<hr>

<label>1. Certified ID Document *</label>
<input type="file" name="file_id" accept=".pdf,.jpg,.png" required>

<label>2. Grade 11 Final Report * (For current Grade 12s)</label>
<input type="file" name="file_grade11" accept=".pdf,.jpg,.png" required>

<label>3. Grade 12 Midyear / June / Term 2 Report *</label>
<input type="file" name="file_grade12_mid" accept=".pdf,.jpg,.png" required>

<label>4. Latest Academic Report / Matric Certificate (if completed)</label>
<input type="file" name="file_matric" accept=".pdf,.jpg,.png">

<label>5. Proof of Residence / Parent ID (if available)</label>
<input type="file" name="file_proof" accept=".pdf,.jpg,.png">

<button type="submit">Submit Application →</button>
<small>By submitting, you agree we are an assistance service, not the university itself. Universities apply free on their official portals.</small>

</form>
</div>
</body>
</html>
