<!DOCTYPE html>
<html>
<head><title>Apply - SA UniApply</title></head>
<body style="font-family:Arial;padding:20px;background:#f0f2f5">
<div style="max-width:600px;margin:auto;background:white;padding:30px;border-radius:15px">
<h2>📝 Student Application</h2>
<form method="POST" enctype="multipart/form-data">
<label>Full Name:</label><br><input name="fullname" required style="width:100%;padding:10px;margin:10px 0"><br>
<label>ID Number:</label><br><input name="idnum" required style="width:100%;padding:10px;margin:10px 0"><br>
<label>Phone/WhatsApp:</label><br><input name="phone" required style="width:100%;padding:10px;margin:10px 0"><br>
<label>Grade 12 Average %:</label><br><input name="average" type="number" required style="width:100%;padding:10px;margin:10px 0"><br>
<label>Course You Want:</label><br>
<select name="course" style="width:100%;padding:10px;margin:10px 0">
<option>Diploma in IT</option><option>Business Management</option>
<option>Engineering</option><option>Education</option><option>Nursing</option>
</select><br>
<label>Upload ID Document (PDF/Photo):</label><br><input type="file" name="iddoc" style="margin:10px 0"><br><br>
<button type="submit" style="background:green;color:white;padding:15px;width:100%;border:none;border-radius:10px;font-size:18px">Submit Application</button>
</form>
<a href="/">← Back Home</a>
</div>
</body>
</html>
