<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Apply</title></head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-xl mx-auto bg-white rounded-2xl p-8 shadow-xl mt-10">
<h2 class="text-2xl font-bold mb-6">📝 Student Application</h2>
<form action="/apply" method="POST" enctype="multipart/form-data" class="space-y-4">
<input name="name" placeholder="Full Name" required class="w-full border p-3 rounded">
<input name="phone" placeholder="WhatsApp Number (e.g. 0812345678)" required class="w-full border p-3 rounded">
<select name="university" class="w-full border p-3 rounded"><option>University of Johannesburg (UJ)</option><option>Wits</option><option>University of Pretoria (UP)</option><option>TUT</option><option>UNISA</option><option>UKZN</option><option>Other</option></select>
<label class="block">Upload ID, Results, Proof: <input type="file" name="documents" multiple required class="w-full mt-2"></label>
<button class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold text-lg">Submit Application 🚀</button>
</form>
<p class="text-center text-sm mt-4">After submit, you will get WhatsApp payment instructions</p>
</div>
</body></html>
