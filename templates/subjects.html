<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enter Subjects</title>
<style>body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px}.box{max-width:950px;margin:0 auto;background:white;color:black;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.subject{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:15px}.subject label{font-weight:bold;display:block;font-size:13px}.subject select,.subject input{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin-top:5px}.percent{display:flex;gap:8px;align-items:center;margin-top:8px}.percent input{flex:1;background:#fffbeb;border:2px solid #facc15;font-weight:bold}.btn{background:#2563eb;color:white;padding:15px;border-radius:12px;border:none;width:100%;font-weight:bold;font-size:18px;margin-top:20px;cursor:pointer}.back{color:#facc15;text-decoration:none}</style>

<div class="subject"><label>6. SUBJECT 6</label><select name="s6"><option>Life Sciences</option><option>Physical Sciences</option><option>Accounting</option><option>Business Studies</option><option>EGD</option><option>Geography</option><option>Economics</option></select><div class="percent"><input type="number" name="s6_pct" placeholder="%" required min="0" max="100"><span><b>%</b></span></div></div>

<div class="subject" style="border-style:dashed"><label>9. EXTRA</label><select><option>Optional</option></select><div class="percent"><input type="number" name="s9_pct" placeholder="%"><span><b>%</b></span></div></div>
<div class="subject" style="border-style:dashed"><label>10. EXTRA</label><select><option>Optional</option></select><div class="percent"><input type="number" name="s10_pct" placeholder="%"><span><b>%</b></span></div></div>
