<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter Your Subjects</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px}
.box{max-width:950px;margin:0 auto;background:white;color:black;border-radius:16px;padding:20px}
h2{text-align:center;color:#0f172a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.subject{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:15px}
.subject label{font-weight:bold;display:block;margin-bottom:6px;font-size:13px;color:#0f172a}
.subject select, .subject input{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin-top:5px}
.percent{display:flex;gap:8px;align-items:center;margin-top:8px}
.percent input{flex:1;background:#fffbeb;border:2px solid #facc15;font-weight:bold}
.btn{background:#2563eb;color:white;padding:15px;border-radius:12px;border:none;width:100%;font-weight:bold;font-size:18px;margin-top:20px;cursor:pointer}
.back{color:#facc15;text-decoration:none}
</style>
</head>
<body>
<a href="/" class="back">← Back to Home</a>
<div class="box">
<h2>📚 Enter Your Subjects + %</h2>
<p style="text-align:center;color:#64748b;font-size:14px">Example: Home Language = IsiXhosa 75% - then enter your % in the yellow box</p>

<form action="/universities">
<div class="grid">

<!-- 1 -->
<div class="subject" style="border-color:#2563eb">
<label>1. HOME LANGUAGE</label>
<select name="hl">
<option>Select Home Language</option>
<option>IsiXhosa Home Language</option>
<option>IsiZulu Home Language</option>
<option>Sepedi (Sesotho sa Leboa) Home Language</option>
<option>Sesotho Home Language</option>
<option>Setswana Home Language</option>
<option>SiSwati Home Language</option>
<option>Tshivenda Home Language</option>
<option>Xitsonga Home Language</option>
<option>Afrikaans Home Language</option>
<option>English Home Language</option>
<option>IsiNdebele Home Language</option>
</select>
<div class="percent"><input type="number" placeholder="Enter % e.g 75" min="0" max="100"><span><b>%</b></span></div>
</div>

<!-- 2 -->
<div class="subject" style="border-color:#2563eb">
<label>2. FIRST ADDITIONAL LANGUAGE</label>
<select name="fal">
<option>Select First Additional</option>

<option>Tshivenda First Additional Language</option>
<option>Xitsonga First Additional Language</option>
<option>IsiNdebele First Additional Language</option>
</select>
<div class="percent"><input type="number" placeholder="Enter % e.g 68" min="0" max="100"><span><b>%</b></span></div>
</div>

<!-- 3 -->
<div class="subject">
<label>3. MATHS</label>
<select name="maths">
<option>Select Maths</option>
<option>Mathematics</option>
<option>Mathematical Literacy</option>
<option>Technical Mathematics</option>
</select>
<div class="percent"><input type="number" placeholder="Enter % e.g 55" min="0" max="100"><span><b>%</b></span></div>
</div>

<!-- 4 -->
<div class="subject">
<label>4. LIFE ORIENTATION</label>
<select><option>Life Orientation</option></select>
<div class="percent"><input type="number" placeholder="Enter % e.g 80" min="0" max="100"><span><b>%</b></span></div>
</div>
