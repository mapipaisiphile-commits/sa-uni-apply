<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Requirements - Enter Subjects</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px}
.box{max-width:1050px;margin:0 auto;background:white;color:black;border-radius:16px;padding:20px}
h2{text-align:center;color:#0f172a}
p.sub{text-align:center;color:#64748b;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.subject{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;overflow:hidden}
.subject img{width:100%;height:85px;object-fit:cover}
.inner{padding:12px}
.subject label{font-weight:bold;display:block;font-size:13px;color:#0f172a;margin-bottom:4px}
.subject select,.subject input{width:100%;padding:11px;border-radius:8px;border:1px solid #cbd5e1;margin-top:5px;font-size:14px}
.percent{display:flex;gap:8px;align-items:center;margin-top:8px}
.percent input{flex:1;background:#fffbeb;border:2px solid #facc15;font-weight:bold}
.btn{background:#2563eb;color:white;padding:16px;border-radius:12px;border:none;width:100%;font-weight:bold;font-size:18px;margin-top:22px;cursor:pointer}
.back{color:#facc15;text-decoration:none}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:bold;margin-bottom:6px}
.blue-badge{background:#dbeafe;color:#1e40af}
.green-badge{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<a href="/" class="back">← Back to Home</a>
<div class="box">
<h2>📚 Check Requirements - Enter Your Subjects + %</h2>
<p class="sub">Example: Home Language = IsiXhosa 75% - Every block has % box</p>

<form action="/calculate" method="POST">
<div class="grid">

<!-- BLOCK 1: HOME LANGUAGE - ALL SA LANGUAGES -->
<div class="subject" style="border-color:#2563eb">
<img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500">
<div class="inner">
<span class="badge blue-badge">BLOCK 1</span>
<label>1. HOME LANGUAGE - All SA Languages</label>
<select name="hl" required>
<option value="">Select Home Language</option>
<option>IsiXhosa Home Language</option>
<option>IsiZulu Home Language</option>
<option>Sepedi (Sesotho sa Leboa) Home Language</option>
<option>Sesotho Home Language</option>
<option>Setswana Home Language</option>
<option>SiSwati Home Language</option>
<option>Tshivenda Home Language</option>
<option>Xitsonga Home Language</option>
<option>Afrikaans Home Language</option>
<option>English Home Language</option>
<option>IsiNdebele Home Language</option>
</select>
<div class="percent"><input type="number" name="hl_pct" placeholder="Enter % e.g 75" min="0" max="100" required><span><b>%</b></span></div>
</div>
</div>
