<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{uni.name}} - Apply 2026</title>
<style>
body{font-family:Arial;background:#f8fafc;margin:0}
.header{background:#002147;color:white;padding:30px 15px;text-align:center}
.header a{color:#facc15;text-decoration:none;font-weight:bold}
.box{max-width:600px;margin:40px auto;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;border:1px solid #e2e8f0}
.btn{display:block;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;margin:12px 0;font-size:18px}
.btn-green{background:#16a34a;color:white}
.btn-blue{background:#002147;color:white}
.btn-yellow{background:#facc15;color:black}
</style>
</head>
<body>
<div class="header">
<a href="/universities">← Back to All 26 Universities</a>
<h1>{{uni.name}}</h1>
<p>{{uni.location}} • Closing: {{uni.closing}}</p>
</div>
<div class="box">
<h2>Apply to {{uni.name}} for 2026</h2>
<p style="color:#64748b">You will be redirected to the OFFICIAL {{uni.name}} application portal.</p>
<a href="{{uni.apply_link}}" target="_blank" class="btn btn-green">✅ Apply Officially on {{uni.code}} Portal ↗</a>
<a href="{{uni.apply_link}}" target="_blank" class="btn btn-blue">📄 Download Prospectus 2026 →</a>
<a href="/universities" class="btn btn-yellow">← View Other 25 Universities</a>
</div>
</body>
</html>
