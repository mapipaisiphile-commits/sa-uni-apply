<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All 26 Universities 2026</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.top{text-align:center;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;max-width:1100px;margin:0 auto;padding:15px}
.card{background:white;color:black;border-radius:12px;padding:15px;text-align:center}
.btn{display:block;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin:6px 0}
.green{background:#16a34a;color:white}
.gray{background:#e2e8f0;color:black}
.back{color:#facc15;text-decoration:none}
</style>
</head>
<body>
<div class="top">
<a href="/" class="back">← Back to Home</a>
<h2>🇿🇦 All 26 Universities 2026</h2>
<p>We help with documents. You apply on the OFFICIAL website.</p>
</div>
<div class="grid">
{% for uni in universities %}
<div class="card">
<h4 style="margin:5px 0">{{uni.name}}</h4>
<small>{{uni.location}} • Closing: {{uni.closing}}</small><br><br>
<a href="{{uni.apply_link}}" target="_blank" class="btn green">✅ Official Apply ↗</a>
<a href="{{uni.apply_link}}" target="_blank" class="btn gray">📄 Prospectus</a>
<a href="/university/{{uni.code}}" class="btn" style="background:#facc15;color:black">View Details</a>
</div>
{% endfor %}
</div>
</body>
</html>
