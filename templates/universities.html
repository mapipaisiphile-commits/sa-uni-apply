<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>All Universities</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:20px;text-align:center}
.header a{color:#facc15;text-decoration:none;font-weight:bold}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:20px}
.card{background:white;color:black;border-radius:20px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:15px}
.badge{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px}
.btn-apply{background:#16a34a;color:white;width:100%;padding:12px;border-radius:12px;border:none;font-weight:bold;display:block;text-align:center;text-decoration:none;margin-top:8px}
.btn-pros{background:#f1f5f9;color:#334155;width:100%;padding:10px;border-radius:12px;border:none;font-weight:bold;display:block;text-align:center;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<a href="/">← Back to Home</a>
<h1>🇿🇦 All 26 Universities 2026</h1>
<p>We help with documents. You apply on the OFFICIAL website.</p>
</div>
<div class="grid">
{% for uni in universities %}
<div class="card">
<img src="{{uni.image}}" alt="">
<div class="card-body">
<h3 style="margin:5px 0">{{uni.name}}</h3>
<p style="margin:5px 0;color:#64748b">{{uni.location}} • Closing: {{uni.closing}}</p>
<span class="badge">Open</span>
<a href="/courses/{{uni.code}}" class="btn-apply">Official Apply</a>
<a href="{{uni.apply_link}}" target="_blank" class="btn-pros">Prospectus</a>
</div>
</div>
{% endfor %}
</div>
</body>
</html>
